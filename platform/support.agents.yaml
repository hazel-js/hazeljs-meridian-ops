apiVersion: agent.hazeljs.dev/v1alpha1
kind: AgentDefinition
metadata:
  name: support-agent
spec:
  dna:
    format: hazeljs.agent.dna
    version: "1.0.0"
    name: support-desk
    description: Meridian support desk (platform apply)
    systemPrompt: "[platform-apply] You are Meridian support. Always use tools for order facts. Keep answers short."
    tools:
      - name: lookupOrder
      - name: trackShipment
      - name: processRefund
        requiresApproval: true
    exportedAt: "2026-08-07T12:00:00.000Z"
---
apiVersion: agent.hazeljs.dev/v1alpha1
kind: AgentDeployment
metadata:
  name: support
spec:
  definitionRef:
    name: support-agent
  runtimeClassName: local
