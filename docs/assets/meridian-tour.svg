<svg xmlns="http://www.w3.org/2000/svg" width="960" height="280" viewBox="0 0 960 280" role="img" aria-labelledby="title desc">
  <title id="title">Meridian Ops tour flow</title>
  <desc id="desc">store sync, platform sync, chat with real tools, optional HITL approve</desc>

  <rect width="960" height="280" fill="#042F2E"/>
  <rect x="0" y="0" width="960" height="280" fill="#0F766E" opacity="0.12"/>

  <text x="32" y="40" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" fill="#F0FDFA">Meridian tour</text>
  <text x="170" y="40" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="14" fill="#99F6E4">~15 min · DemoLLM · no API key</text>

  <!-- Step 1 -->
  <rect x="32" y="68" width="190" height="100" rx="14" fill="#0F3D3A" stroke="#2DD4BF" stroke-width="2"/>
  <text x="52" y="104" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#F0FDFA">1 · store:sync</text>
  <text x="52" y="130" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="13" fill="#99F6E4">DNA packages</text>
  <text x="52" y="150" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="13" fill="#5EEAD4">+ lockfile</text>

  <path d="M232 118 H258" stroke="#2DD4BF" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M250 110 L262 118 L250 126" fill="none" stroke="#2DD4BF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Step 2 -->
  <rect x="270" y="68" width="190" height="100" rx="14" fill="#0F3D3A" stroke="#14B8A6" stroke-width="2"/>
  <text x="290" y="104" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#F0FDFA">2 · platform:sync</text>
  <text x="290" y="130" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="13" fill="#99F6E4">desired state</text>
  <text x="290" y="150" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="13" fill="#5EEAD4">Definitions</text>

  <path d="M470 118 H496" stroke="#2DD4BF" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M488 110 L500 118 L488 126" fill="none" stroke="#2DD4BF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Step 3 -->
  <rect x="508" y="68" width="190" height="100" rx="14" fill="#0F3D3A" stroke="#0D9488" stroke-width="2"/>
  <text x="528" y="104" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#F0FDFA">3 · npm run dev</text>
  <text x="528" y="130" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="13" fill="#99F6E4">/api/*/chat</text>
  <text x="528" y="150" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="13" fill="#5EEAD4">real @Tool handlers</text>

  <path d="M708 118 H734" stroke="#2DD4BF" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M726 110 L738 118 L726 126" fill="none" stroke="#2DD4BF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Step 4 -->
  <rect x="746" y="68" width="182" height="100" rx="14" fill="#0F3D3A" stroke="#5EEAD4" stroke-width="2"/>
  <text x="766" y="104" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#F0FDFA">4 · HITL</text>
  <text x="766" y="130" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="13" fill="#99F6E4">approve / reject</text>
  <text x="766" y="150" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="13" fill="#5EEAD4">AGENT_OS_HITL=1</text>

  <rect x="32" y="196" width="896" height="56" rx="12" fill="#022C26" stroke="#134E4A" stroke-width="1"/>
  <text x="52" y="222" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="13" fill="#CCFBF1">Always on: six agents · Gatekeeper · Decision · RAG helpdesk · Inspector</text>
  <text x="52" y="244" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="12" fill="#5EEAD4">CAG / KAG / Context live under examples/ (offline labs). apply does not restart Node.</text>
</svg>
